<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المساعد الدراسي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#12263A;--mute:#6B7A8A;--line:#E1E6EB;--pri:#0E7C7B;--pri-s:#DDF1F0;--warn:#B96A00;--warn-s:#FDEBD0;--bad:#C0394B;--ok:#2E8B57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A24;--card:#17242F;--ink:#E8EEF3;--mute:#8FA0B0;--line:#243442;--pri:#3CC4C2;--pri-s:#143B3C;--warn:#F2A541;--warn-s:#3A2B14;--bad:#F0707F;--ok:#5CC48A}}
:root[data-theme="dark"]{--bg:#0F1A24;--card:#17242F;--ink:#E8EEF3;--mute:#8FA0B0;--line:#243442;--pri:#3CC4C2;--pri-s:#143B3C;--warn:#F2A541;--warn-s:#3A2B14;--bad:#F0707F;--ok:#5CC48A}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;display:flex;justify-content:center}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.app{width:100%;max-width:900px;height:100%;display:flex;flex-direction:column;background:var(--bg);margin:0 auto;box-shadow:0 0 20px rgba(0,0,0,0.1)}
header{padding:18px 18px 8px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;font-weight:700;flex:1}
header button{background:none;border:0;color:var(--ink);font-size:22px;cursor:pointer}
main{flex:1;overflow-y:auto;padding:4px 16px 16px}
.sec{font-size:14px;color:var(--mute);margin:16px 2px 8px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}
.dot{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--pri-s)}
.grow{flex:1;min-width:0}
.t{font-weight:700;font-size:15px}.s{font-size:13px;color:var(--mute);margin-top:2px}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--pri-s);color:var(--pri);font-weight:700}
.badge.w{background:var(--warn-s);color:var(--warn)}
.badge.d{background:var(--line);color:var(--mute)}
.subj{cursor:pointer;transition:transform 0.1s}
.subj:active{transform:scale(0.98)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 10px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
:root[data-theme="dark"] .tab.on{color:#0F1A24}
.btn{border:0;border-radius:10px;padding:8px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
:root[data-theme="dark"] .btn{color:#0F1A24}
.btn.done{background:var(--pri-s);color:var(--ok)}
.vote{display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;cursor:pointer}
.vote.on{border-color:var(--pri);color:var(--pri)}
.solved{color:var(--ok);font-size:13px;font-weight:700;margin-top:6px}
.del-btn{background:var(--bad);color:#fff;border:none;border-radius:8px;width:34px;height:34px;cursor:pointer;display:grid;place-items:center;font-size:14px;flex-shrink:0}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button.on{color:var(--pri);font-weight:700}
.back{background:none;border:0;color:var(--pri);font:inherit;font-size:15px;cursor:pointer;padding:0 16px 4px}
.code{font-size:26px;font-weight:700;letter-spacing:3px;text-align:center;direction:ltr;padding:10px;background:var(--pri-s);color:var(--pri);border-radius:12px;margin:8px 0}
.empty{text-align:center;color:var(--mute);padding:30px 10px;font-size:14px}
@media (min-width: 768px) {
    #main { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; align-content: start; }
    .sec { grid-column: 1 / -1; }
    .empty { grid-column: 1 / -1; }
    .card { margin-bottom: 0; }
}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="title">اليوم</h1><button id="theme" aria-label="تغيير المظهر">◐</button></header>
  <div id="tabs"></div>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<script>
var subjects = []; 
var hw = [];
var lectures = {}; 
var questions = {}; 
var batchCode="CS-S3-2026";
var view="home",sel=null,tab="lec";
var currentUser = JSON.parse(localStorage.getItem('currentUser')) || null; 

var $=function(i){return document.getElementById(i)};
var sub=function(id){return subjects.filter(function(x){return x.id===id})[0]};

fetch('https://batch-api-oj4n.vercel.app/api/subjects')
    .then(response => response.json())
    .then(data => {
        subjects = data.map(item => ({
            id: item.id, n: item.name, i: item.icon, new: item.is_new
        }));
        render(); 
    }).catch(error => console.error("خطأ:", error));

fetch('https://batch-api-oj4n.vercel.app/api/homeworks')
    .then(response => response.json())
    .then(data => {
        hw = data.map(item => ({
            id: item.id, s: item.subject_id, t: item.title, d: item.due_date, done: item.is_done, soon: true 
        }));
        render();
    }).catch(error => console.error("خطأ:", error));

function nav(){
    var items=[["home","🏠","الرئيسية"],["hw","✅","الواجبات"],["batch","👥","الدفعة"],["me","⚙️","الحساب"]];
    $("nav").innerHTML=items.map(function(x){return '<button class="'+(view===x[0]&&!sel?"on":"")+'" onclick="go(\''+x[0]+'\')"><span>'+x[1]+'</span>'+x[2]+'</button>'}).join("");
}

function go(v){view=v;sel=null;render()}

function hwCard(h,showSub){
    var b=h.done?'<button class="btn done" onclick="tog('+h.id+')">✓ سلّمت</button>':'<button class="btn" onclick="tog('+h.id+')">سلّمت</button>';
    return '<div class="card row"><div class="grow"><div class="t">'+h.t+'</div><div class="s">'+(showSub?sub(h.s).n+' • ':'')+'<span class="badge '+(h.done?"d":h.soon?"w":"")+'">'+h.d+'</span></div></div>'+b+'</div>';
}

function tog(id) {
    fetch('https://batch-api-oj4n.vercel.app/api/homeworks/' + id + '/toggle', { method: 'POST' })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            hw.forEach(function(h) {
                if (h.id === id) {
                    h.done = data.new_status;
                    h.d = h.done ? "سُلّم" : "بعد يومين";
                }
            });
            render();
        }
    }).catch(error => console.error("خطأ:", error));
}

function vote(id){qa.forEach(function(q){if(q.id===id){q.my=!q.my;q.v+=q.my?1:-1}});render()}

function loadLectures(subjectId) {
    fetch('https://batch-api-oj4n.vercel.app/api/lectures/' + subjectId)
    .then(response => response.json())
    .then(data => {
        lectures[subjectId] = data; 
        render(); 
    })
    .catch(error => console.error("خطأ في جلب المحاضرات:", error));
}
function loadQuestions(subjectId) {
    fetch('https://batch-api-oj4n.vercel.app/api/questions/' + subjectId)
    .then(response => response.json())
    .then(data => {
        questions[subjectId] = data; 
        render(); 
    }).catch(error => console.error("خطأ:", error));
}

// تعديل دالة فتح المادة لتقوم بجلب الأسئلة مع المحاضرات فوراً
function open_(id){
    sel=id;
    tab="lec";
    loadLectures(id); 
    loadQuestions(id); // السطر الجديد
    render();
}

function askQuestion() {
    var q = prompt("اكتب سؤالك هنا ليراه الجميع:");
    if (!q) return;
    fetch('https://batch-api-oj4n.vercel.app/api/questions/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject_id: sel, q_text: q })
    }).then(r => r.json()).then(d => { if(d.status === "success") loadQuestions(sel); });
}

function answerQuestion(q_id) {
    var a = prompt("اكتب إجابتك كـ مشرف:");
    if (!a) return;
    fetch('https://batch-api-oj4n.vercel.app/api/questions/' + q_id + '/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ a_text: a })
    }).then(r => r.json()).then(d => { if(d.status === "success") loadQuestions(sel); });
}

function voteQ(q_id) {
    fetch('https://batch-api-oj4n.vercel.app/api/questions/' + q_id + '/vote', { method: 'POST' })
    .then(r => r.json()).then(d => { if(d.status === "success") loadQuestions(sel); });
}
function open_(id){
    sel=id;
    tab="lec";
    loadLectures(id); 
    render();
}

function handleAddLink() {
    var title = prompt("أدخل اسم المحاضرة (مثال: ملزمة الفصل الأول):");
    if (!title) return;
    
    var url = prompt("أدخل الرابط العام للمحاضرة (من جوجل درايف أو غيره):");
    if (!url) return;

    fetch('https://batch-api-oj4n.vercel.app/api/lectures/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subject_id: sel, title: title, file_url: url })
    })
    .then(response => response.json())
    .then(data => {
        if(data.status === "success") {
            alert("تمت إضافة المحاضرة بنجاح!");
            loadLectures(sel); 
        }
    })
    .catch(error => console.error("خطأ في الإضافة:", error));
}

function deleteFile(lectureId) {
    if (confirm("هل أنت متأكد من حذف هذا الملف نهائياً؟")) {
        fetch('https://batch-api-oj4n.vercel.app/api/lectures/' + lectureId, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                loadLectures(sel); 
            }
        })
        .catch(error => console.error("خطأ في الحذف:", error));
    }
}

function render(){
    nav();$("tabs").innerHTML="";var m="";
    
    if(sel){
        var s=sub(sel);$("title").textContent=s.i+" "+s.n;
        $("tabs").innerHTML='<button class="back" onclick="go(\'home\')">← رجوع</button><div class="tabs">'+[["lec","محاضرات"],["hw","واجبات"],["qa","أسئلة"],["ex","امتحانات"]].map(function(t){return '<button class="tab '+(tab===t[0]?"on":"")+'" onclick="tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join("")+'</div>';

        if(tab==="lec"){
            var L = lectures[sel] || [];
            m = L.length ? L.map(function(l){
                var clickAction = l.file_url ? 'href="'+l.file_url+'" target="_blank"' : 'href="#"';
                
                // خوارزمية فحص الرابط لتحديد اللوغو
                var icon = "🔗"; 
                var typeName = "رابط";
                if (l.file_url) {
                    if (l.file_url.includes("youtube.com") || l.file_url.includes("youtu.be")) {
                        icon = "🎥";
                        typeName = "فيديو";
                    } else if (l.file_url.includes("drive.google.com")) {
                        icon = "☁️";
                        typeName = "درايف";
                    } else if (l.file_url.includes(".pdf")) {
                        icon = "📕";
                        typeName = "PDF";
                    }
                }

                return '<div class="card row subj" style="gap:8px; padding-right:10px;">'+
                         '<a '+clickAction+' class="grow row" style="text-decoration:none;color:inherit;gap:12px">'+
                           '<div class="dot">'+icon+'</div><div class="grow"><div class="t">'+l.title+'</div><div class="s">تم الرفع</div></div><span class="badge">'+typeName+'</span>'+
                         '</a>'+
                         (currentUser && currentUser.role === 'admin' ? '<button class="del-btn" onclick="deleteFile('+l.id+')" title="حذف الملف">✖</button>' : '') +
                       '</div>';
            }).join("") : '<div class="empty">لا توجد محاضرات بعد.</div>';

            if (currentUser && currentUser.role === 'admin') {
                m += '<button class="btn" style="width:100%;padding:12px;margin-top:10px" onclick="handleAddLink()">+ إضافة رابط محاضرة</button>';
            }
        }
        else if(tab==="hw"){var H=hw.filter(function(h){return h.s===sel});m=H.length?H.map(function(h){return hwCard(h,false)}).join(""):'<div class="empty">ماكو واجبات بهاي المادة.</div>'}
        else if(tab==="qa"){
            var Q = questions[sel] || [];
            m = Q.length ? Q.map(function(q){
                var ansHtml = q.a_text ? '<div class="s" style="margin-top:6px; color:var(--ok); font-weight:bold;">الجواب: '+q.a_text+'</div>' : '<div class="s">بانتظار جواب</div>';
                
                // أزرار الإدارة (الرد + الحذف)
                var adminBtns = '';
                if (currentUser && currentUser.role === 'admin') {
                    adminBtns += '<div style="display:flex; flex-direction:column; gap:4px; margin-right:auto;">';
                    adminBtns += '<button class="del-btn" style="width:30px;height:30px;font-size:12px;" onclick="deleteQuestion('+q.id+')" title="حذف السؤال">✖</button>';
                    if (!q.a_text) {
                        adminBtns += '<button class="badge w" style="border:none; cursor:pointer; padding:6px;" onclick="answerQuestion('+q.id+')">أجب</button>';
                    }
                    adminBtns += '</div>';
                }
                
                return '<div class="card row" style="align-items:flex-start"><button class="vote" style="border:none" onclick="voteQ('+q.id+')"><span>▲</span><b>'+q.votes+'</b></button><div class="grow"><div class="t">'+q.q_text+'</div>'+ansHtml+'</div>'+adminBtns+'</div>';
            }).join("") : '<div class="empty">لا توجد أسئلة بعد. اطرح سؤالك الأول!</div>';
            
            m += '<button class="btn" style="width:100%;padding:12px;margin-top:10px" onclick="askQuestion()">+ اسأل سؤال</button>';
        }
        else if(tab==="ex"){m='<div class="card row"><div class="dot">🗓️</div><div class="grow"><div class="t">الامتحان الشهري الأول</div><div class="s">بعد 3 أسابيع</div></div><span class="badge w">قريب</span></div>'}
    }
    else if(view==="home"){
        $("title").textContent="اليوم";
        var due=hw.filter(function(h){return h.soon&&!h.done});
        m='<div class="sec">واجبات قريبة</div>'+(due.length?due.map(function(h){return hwCard(h,true)}).join(""):'<div class="empty">خلصت كل واجباتك 🎉</div>')+'<div class="sec">المواد</div>'+subjects.map(function(s){return '<div class="card row subj" onclick="open_(\''+s.id+'\')"><div class="dot">'+s.i+'</div><div class="grow"><div class="t">'+s.n+'</div></div>'+(s.new?'<span class="badge">'+s.new+' جديد</span>':'')+'</div>'}).join("");
    }
    else if(view==="hw"){
        $("title").textContent="الواجبات";
        var p=hw.filter(function(h){return !h.done}),d=hw.filter(function(h){return h.done});
        m='<div class="sec">المتبقي ('+p.length+')</div>'+p.map(function(h){return hwCard(h,true)}).join("")+'<div class="sec">المسلّم ('+d.length+')</div>'+d.map(function(h){return hwCard(h,true)}).join("");
    }
    else if(view==="batch"){
        $("title").textContent="معلومات الدفعة";
        m = `
        <div class="card" style="grid-column: 1 / -1; text-align:center; padding:30px 20px;">
            <div class="dot" style="margin:0 auto 15px; width:60px; height:60px; font-size:30px;">🎓</div>
            <div class="t" style="font-size:18px;">علوم الذكاء الاصطناعي - المرحلة الثانية</div>
            <div class="s" style="margin-top:5px;">إشراف وإدارة: مهدي (ممثل الدفعة)</div>
            <hr style="border:0; border-top:1px solid var(--line); margin:20px 0;">
            <p class="s" style="margin-bottom:15px; line-height:1.6; font-size:14px;">
                هذا النظام مخصص لتنظيم المحاضرات والأسئلة. جميع الشروحات والمواد تقدم للطلاب مجاناً ولا يتطلب النظام أي أكواد دعوة لتنزيل الملفات.
            </p>
            <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
                <a href="#" class="btn" style="text-decoration:none; flex:1; min-width:140px;">قناة التليجرام</a>
                <a href="#" class="btn done" style="text-decoration:none; flex:1; min-width:140px;">جدول المحاضرات</a>
            </div>
        </div>`;
    }
    else if(view==="me") {
        $("title").textContent = "تسجيل الدخول";
        m = `
        <div class="card" style="display:flex; flex-direction:column; gap:12px; padding:20px;">
            <div class="t" style="text-align:center; font-size:18px;">تسجيل الدخول للنظام</div>
            <input type="email" id="email" placeholder="البريد الإلكتروني" style="padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:var(--bg); color:var(--ink);">
            <input type="password" id="password" placeholder="كلمة المرور" style="padding:10px; border:1px solid var(--line); border-radius:8px; font:inherit; background:var(--bg); color:var(--ink);">
            <button class="btn" style="width:100%; margin-top:10px;" onclick="login()">دخول</button>
        </div>
        `;
    }

    $("main").innerHTML = m;
    $("main").scrollTop = 0;
}

$("theme").onclick=function(){var r=document.documentElement,dark=r.getAttribute("data-theme")==="dark"||(!r.getAttribute("data-theme")&&matchMedia("(prefers-color-scheme: dark)").matches);r.setAttribute("data-theme",dark?"light":"dark")};
render();

function login() {
    var email = document.getElementById("email").value;
    var password = document.getElementById("password").value;

    if(!email || !password) {
        alert("أدخل الإيميل وكلمة المرور أولاً!");
        return;
    }

    fetch('https://batch-api-oj4n.vercel.app/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === "success") {
            currentUser = data.user; 
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
            alert(data.message + "\\nمرحباً: " + currentUser.name + "\\nالصلاحية: " + currentUser.role);
            go('home'); 
        } else {
            alert("فشل الدخول: " + data.detail);
        }
    })
    .catch(error => console.error("خطأ في الاتصال:", error));
}
function deleteQuestion(q_id) {
    if (confirm("بصفتك مشرفاً، هل أنت متأكد من حذف هذا السؤال نهائياً؟")) {
        fetch('https://batch-api-oj4n.vercel.app/api/questions/' + q_id, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                loadQuestions(sel); // تحديث القائمة فوراً
            }
        })
        .catch(error => console.error("خطأ في الحذف:", error));
    }
}
</script>
</body>
</html>
